    username: postgres
    password: rootpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


jwt:
  secret: MxkrP4NmQob5jWsYLTupSc2NnhrB7MTnJYppL7+FTeJLQlV49SgQiJ+Gb+gyLT+W
